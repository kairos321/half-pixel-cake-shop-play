  <style>
:root {
  color-scheme: dark;
  --ink: #302039;
  --cream: #fbf2e8;
  --muted: #c5b5c8;
  --gold: #edc997;
  --plum: #5f376b;
  --sans: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", system-ui, sans-serif;
  --serif: "Songti SC", "STSong", "Noto Serif CJK SC", "SimSun", serif;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0;
  min-width: 290px;
  min-height: 100vh;
  color: var(--cream);
  font: 15px/1.6 var(--sans);
  background: radial-gradient(ellipse at 48% -22%, #412a46 0, #24192c 36%, #17121f 76%);
}
button, a { -webkit-tap-highlight-color: transparent; }
button { font: inherit; cursor: pointer; }
button:focus-visible, a:focus-visible {
  outline: 3px solid #b489e4;
  outline-offset: 4px;
}
.shell { width: min(1232px, 100% - 80px); margin-inline: auto; }
.site-header { border-bottom: 1px solid #f5ded51c; background: #1a1421a8; }
.header-content {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 18px;
  min-height: 71px;
}
.brand { display: inline-flex; align-items: center; gap: 11px; color: var(--cream); text-decoration: none; font-weight: 700; white-space: nowrap; }
.brand-mark { display: grid; width: 40px; height: 40px; place-items: center; border: 1px solid #b78a8450; border-radius: 12px; background: #382538; }
.brand-mark img { width: 30px; height: 30px; object-fit: contain; }
.header-content nav { display: flex; align-items: center; gap: 10px; }
.nav-button, .quiet-button {
  border: 1px solid transparent;
  border-radius: 9px;
  color: #e1d3dd;
  background: transparent;
  min-height: 40px;
  padding: 7px 13px;
  font-size: 13px;
  white-space: nowrap;
}
.nav-button:hover, .quiet-button:hover { background: #e0cae713; color: #fff3e9; }
.journal-button { border-color: #edd3ec37; background: #38293f; }
.journal-button span { margin-left: 6px; color: #eac794; font-size: 12px; font-variant-numeric: tabular-nums; }

.intro { padding-block: 34px 25px; }
.eyebrow { margin: 0 0 5px; color: var(--gold); font-size: 12px; letter-spacing: .14em; }
.eyebrow span { margin-right: 6px; font-size: 14px; }
h1, h2, p { margin-top: 0; }
h1 {
  margin: 0;
  font: 700 clamp(40px, 5vw, 67px)/1.14 var(--serif);
  letter-spacing: .055em;
  color: #fff3e8;
  text-shadow: 0 2px 20px #130b15;
}
.subtitle { margin: 12px 0 0; color: #dbcbd7; font-size: 15px; }

.game-layout { display: grid; grid-template-columns: minmax(0, 2.15fr) minmax(305px, 1fr); gap: 19px; }
.scene {
  isolation: isolate;
  min-width: 0;
  position: relative;
  min-height: 530px;
  overflow: hidden;
  border: 1px solid #e2c19d52;
  border-radius: 22px;
  background: #362636;
  box-shadow: 0 18px 44px #0f09166b;
}
.scene-background, .scene-shade { position: absolute; width: 100%; height: 100%; inset: 0; }
.scene-background { object-fit: cover; object-position: 53% 55%; z-index: -3; transition: filter .7s ease; }
.scene[data-lights="1"] .scene-background { filter: brightness(.82) saturate(.9); }
.scene[data-lights="0"] .scene-background { filter: brightness(.58) saturate(.72); }
.scene[data-featured="true"] .scene-background { filter: brightness(.95); object-position: 58% center; }
.scene-shade { z-index: -2; background: linear-gradient(180deg,#110b1b51 0, transparent 27%, transparent 70%,#130b19c7 100%); pointer-events: none; }
.scene-status { position: absolute; inset: 17px 18px auto; display: flex; justify-content: space-between; align-items: center; gap: 8px; z-index: 2; }
.shop-status, .windows {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  min-height: 33px;
  border-radius: 30px;
  padding: 5px 12px;
  font-size: 12px;
  color: #ffe8ca;
  border: 1px solid #f8d9b642;
  background: #211628dc;
}
.status-light, .save-dot {
  display: inline-block;
  border-radius: 50%;
  width: 7px;
  height: 7px;
  background: #e9bb79;
  box-shadow: 0 0 8px #efb666a0;
}
.scene[data-lights="0"] .status-light { background: #9f8aab; box-shadow: none; }
.window-icon {
  display: block;
  width: 12px;
  height: 13px;
  border: 1px solid #a798ac;
  border-radius: 2px;
  color: #a798ac;
  background: linear-gradient(90deg,transparent 45%,currentColor 45% 55%,transparent 55%),
              linear-gradient(0deg,transparent 45%,currentColor 45% 55%,transparent 55%);
}
.window-icon.lit {
  color: #946b4d;
  border-color: #f1cf9c;
  background-color: #f1cf9c;
  box-shadow: 0 0 9px #efb66680;
}
.scene-caption {
  position: absolute;
  bottom: 19px;
  left: 20px;
  color: #fff0db;
  font-size: 12px;
  text-shadow: 0 2px 5px #100a13;
}
.caption-pin { display: inline-block; width: 9px; height: 9px; margin-right: 5px; border: 1px solid #f0c990; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); }
.character {
  position: absolute;
  right: 8%;
  bottom: 15%;
  width: min(42%, 350px);
  height: auto;
  filter: drop-shadow(0 13px 17px #150a1c8a);
  animation: appear .33s ease-out both;
}
@keyframes appear { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
.cake-moment {
  position: absolute;
  width: clamp(160px, 35%, 290px);
  right: 10%;
  bottom: 14%;
  filter: drop-shadow(0 12px 18px #1b102acc);
  animation: appear .3s ease-out both;
}
.cake-moment img { display: block; width: 100%; height: auto; }
.cake-berry {
  display: none;
  position: absolute;
  left: 48%;
  top: 28%;
  width: 12%;
  aspect-ratio: 1;
  border-radius: 48%;
  border: 1px solid #1c122e;
  background: radial-gradient(circle at 46% 34%, #b7a2e8 0 8%, #78609a 14% 24%, #443564 54%, #1f182d 85%);
  box-shadow: 0 1px 4px #0b0613ad, 0 0 13px #cfb1ed90;
}
.cake-berry.placed { display: block; animation: appear .45s ease-out both; }

.dialogue {
  min-width: 0;
  display: flex;
  flex-direction: column;
  padding: 30px 28px 23px;
  border: 1px solid #ebd1c9;
  border-radius: 22px;
  background: linear-gradient(146deg,#fff7ed,#f3e5e6);
  color: var(--ink);
  box-shadow: 0 18px 44px #0f091644;
}
.chapter-track { display: flex; gap: 6px; }
.chapter-track span { flex: 1; height: 3px; border-radius: 4px; background: #ddcbd7; }
.chapter-track .visited { background: #b894bd; }
.chapter-track .current { background: #794983; }
.story { flex: 1; padding-block: 23px 14px; }
.chapter-label { margin: 0 0 4px; color: #75477d; font-size: 13px; font-weight: 700; letter-spacing: .14em; }
.story h2 {
  font: 700 clamp(25px, 2.5vw, 35px)/1.24 var(--serif);
  color: #331f37;
  margin: 0 0 24px;
}
.speaker {
  display: flex;
  align-items: center;
  gap: 7px;
  color: #704879;
  font-size: 13px;
  font-weight: 700;
}
.speaker-mark { width: 7px; height: 7px; border-radius: 2px; transform: rotate(45deg); background: #9672a0; }
.speaker[data-character="true"] .speaker-mark { background: #ab743c; }
.line {
  margin: 9px 0 0;
  min-height: 5.3em;
  white-space: pre-line;
  line-height: 1.86;
  font-size: 15px;
  color: #49374c;
}
.letter-heading { margin: 10px 0 5px; color: #745778; font-size: 12px; }
.story-letter .line {
  min-height: 0;
  margin: 0;
  padding: 12px 14px;
  border-radius: 3px 13px 13px 13px;
  border: 1px solid #ddc8dc;
  background: #f0e3f0;
}
.actions { display: grid; gap: 8px; }
.action {
  display: flex;
  align-items: center;
  gap: 9px;
  width: 100%;
  min-height: 50px;
  padding: 10px 12px;
  border: 1px solid #d8becf;
  border-radius: 10px;
  color: #432a49;
  background: #fffbf8ba;
  text-align: left;
  line-height: 1.43;
  font-size: 13px;
  font-weight: 700;
  transition: background-color .16s, transform .16s, border-color .16s;
}
.action:hover { background: #fff9ff; border-color: #aa7aac; transform: translateY(-1px); }
.action.primary { min-height: 53px; color: #fff5f0; border-color: #66396f; background: #62396f; }
.action.primary:hover { background: #784680; }
.action .arrow { margin-left: auto; padding-left: 4px; color: #9d779f; }
.action.primary .arrow { color: #f4d8bd; }
.choice-index {
  display: grid;
  width: 22px;
  height: 22px;
  flex: 0 0 22px;
  place-items: center;
  border-radius: 6px;
  color: #714878;
  background: #eadbe9;
  font-size: 11px;
}
.choice-hint { margin: 9px 0 0; color: #705b72; text-align: right; font-size: 11px; }
.game-footer { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 12px; padding-bottom: 24px; color: var(--muted); font-size: 12px; }
.game-footer p { margin: 0; }
.game-footer .save-dot { width: 5px; height: 5px; margin-right: 4px; background: #b69ac3; box-shadow: none; }
.quiet-button { color: var(--muted); min-height: 36px; font-size: 12px; }

.game-modal {
  color-scheme: light;
  width: min(540px, 100% - 28px);
  padding: 24px;
  max-height: calc(100dvh - 30px);
  overflow: auto;
  color: var(--ink);
  border: 1px solid #d9bcca;
  border-radius: 18px;
  background: #fff5ed;
  box-shadow: 0 14px 60px #1008169a;
}
.game-modal::backdrop { background: #0f0817b8; backdrop-filter: blur(4px); }
.modal-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
.modal-top h2 { margin: 0; font: 700 30px/1.3 var(--serif); }
.close-button { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 8px; border: 1px solid #e2cddc; background: #f2e4ec; color: var(--ink); font-size: 23px; }
.close-button:hover { background: #ead8e6; }
.modal-rule { margin: 0 0 15px; }
.modal-rule strong { display: block; color: var(--plum); }
.modal-rule:last-child { margin-bottom: 0; }
.modal-actions { display: grid; gap: 9px; }
.memory { margin-bottom: 8px; border: 1px solid #ead4e1; border-radius: 9px; background: #fbf0f2; padding: 12px; color: #5c4661; }
.memory summary { cursor: pointer; color: #56305d; font-weight: 700; }
.memory p { margin: 8px 0 0; white-space: pre-line; }
.memory.locked { color: #6d5a71; }
.memory-art { display: block; margin-top: 9px; width: 100%; height: auto; border-radius: 8px; }
.modal-section { margin: 15px 0 8px; color: var(--plum); font-size: 14px; }
.message-thread { display: grid; gap: 8px; padding-bottom: 14px; }
.message-thread + .message-thread { border-top: 1px solid #e6d2dd; padding-top: 14px; }
.message-thread h3 { margin: 0; color: var(--plum); font-size: 13px; }
.message-thread p { width: fit-content; max-width: 88%; margin: 0; padding: 9px 12px; border-radius: 4px 12px 12px; background: #efe2ee; }
.message-thread .outgoing { justify-self: end; border-radius: 12px 4px 12px 12px; background: #e7d6ec; }
#letter-count { color: var(--gold); font-variant-numeric: tabular-nums; }
.noscript { margin: 10px 30px; color: #ffebce; }

@media (max-width: 960px) {
  .shell { width: calc(100% - 42px); }
  .game-layout { grid-template-columns: minmax(0, 1.45fr) minmax(295px, 1fr); gap: 13px; }
  .scene { min-height: 510px; }
  .dialogue { padding: 25px 20px 19px; }
  .character { right: 4%; width: min(57%, 340px); }
}
@media (max-width: 680px) {
  .shell { width: calc(100% - 28px); }
  .header-content { min-height: 58px; gap: 6px; }
  .header-content nav { gap: 2px; }
  .brand { gap: 6px; font-size: 13px; }
  .brand-mark { width: 30px; height: 30px; border-radius: 8px; }
  .brand-mark img { width: 23px; height: 23px; }
  .nav-button { padding: 5px 6px; font-size: 11px; min-height: 34px; }
  .journal-button span { font-size: 10px; margin-left: 2px; }
  .intro { padding-block: 21px 17px; }
  .eyebrow { font-size: 11px; }
  h1 { font-size: clamp(36px, 10vw, 49px); }
  .subtitle { margin-top: 8px; font-size: 13px; }
  .game-layout { display: block; }
  .scene { min-height: 0; height: clamp(215px, 64vw, 360px); border-radius: 15px; margin-bottom: 11px; }
  .scene-status { inset: 10px 10px auto; }
  .scene-caption { bottom: 8px; left: 11px; font-size: 10px; }
  .shop-status, .windows { padding: 4px 8px; min-height: 27px; font-size: 10px; }
  .character { right: 9%; bottom: 10%; width: min(47%, 206px); }
  .cake-moment { right: 11%; bottom: 8%; width: 35%; min-width: 100px; }
  .dialogue { border-radius: 15px; padding: 17px 16px 16px; }
  .story { padding-block: 13px 12px; }
  .story h2 { margin-bottom: 13px; }
  .line { font-size: 14px; min-height: 0; }
  .choice-hint { display: none !important; }
  .game-footer { margin-top: 5px; padding-bottom: 11px; font-size: 11px; }
}
@media (max-width: 410px) {
  .brand > span:last-child { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

/* The night street uses the same layout for every character. */
:root {
  --ink: #f4ebed;
  --plum: #ebcbd7;
  --highlight: #eac49e;
  --panel: #262134;
  --edge: #a58da547;
  --soft: #c8bace;
}

body { background: radial-gradient(ellipse at 68% -15%, #3d2b50 0, #21192f 43%, #151121 84%); }
body[data-route="cat"] {
  --highlight: #bde0ef;
  --plum: #c8dcea;
  --panel: #1d2839;
  --edge: #8baac04d;
  --soft: #c1cddb;
  background: radial-gradient(ellipse at 68% -15%, #283d56 0, #1b263a 43%, #111724 84%);
}
.site-header { background: #151121d9; }
body[data-route="cat"] .site-header { background: #111724df; }
.header-content { min-height: 66px; }
.brand-mark { border-radius: 50%; }
.route-picker { display: flex; gap: 5px; border: 1px solid var(--edge); border-radius: 32px; padding: 4px; background: #11101aa1; }
.route-button {
  min-height: 38px; padding: 6px 18px; border: 1px solid transparent; border-radius: 24px;
  background: transparent; color: var(--soft); font-size: 13px; font-weight: 700; white-space: nowrap;
}
.route-button[aria-pressed="true"] { background: var(--highlight); color: #251b2e; }
.route-button[aria-pressed="false"]:hover { border-color: var(--edge); color: var(--cream); }
.intro { padding-block: 25px 20px; }
h1 { font-size: clamp(38px, 5vw, 56px); }
.subtitle { color: var(--soft); margin-top: 6px; }
.game-layout { grid-template-columns: minmax(0, 2fr) minmax(310px, 1fr); gap: 15px; }
.scene { min-height: 535px; border-color: var(--edge); border-radius: 22px; }
.scene-background { object-position: center; }
.scene[data-route="cat"] .character { width: min(62%, 465px); right: 5%; bottom: 7%; }
.scene[data-route="cat"] .character[data-study="true"] { width: min(62%, 445px); bottom: 7%; }
.shop-status, .windows { background: #161322e2; }
.scene-caption { color: #f4e8db; }

.dialogue {
  padding: 29px 26px 24px;
  background: linear-gradient(151deg, var(--panel), #171524 94%);
  color: var(--ink);
  border-color: var(--edge);
}
body[data-route="cat"] .dialogue { background: linear-gradient(151deg, var(--panel), #131b2b 94%); }
.dialogue h2 { margin: 0; color: #fff3e9; font: 700 clamp(26px, 3vw, 38px)/1.22 var(--serif); }
.story h2 { margin-bottom: 21px; }
.chapter-label, .speaker, .letter-heading { color: var(--highlight); }
.speaker-mark { background: var(--highlight); }
.chapter-track span { background: #ffffff24; }
.chapter-track .visited { background: #f1dbd174; }
.chapter-track .current { background: var(--highlight); }
.line, .home-line { color: #f4e9ed; }
.story-letter .line { background: #ffffff0d; border-color: var(--edge); }
.home-panel h2 { font-size: clamp(39px, 4.5vw, 61px); margin: 9px 0 15px; }
.home-line { min-height: 4.8em; line-height: 1.85; }
.home-interactions { display: flex; flex-wrap: wrap; gap: 8px; }
.interaction {
  border: 1px solid var(--edge); border-radius: 10px; background: #ffffff0a; color: var(--ink);
  padding: 8px 11px; min-height: 42px; font-size: 13px;
}
.interaction:hover, .replay-button:hover { background: #ffffff19; }
.home-progress { margin-top: auto; padding: 22px 0 16px; color: var(--soft); font-size: 13px; }
.home-progress p { margin-bottom: 10px; }
.action { color: var(--ink); border-color: var(--edge); background: #ffffff0c; }
.action:hover { background: #ffffff17; border-color: var(--highlight); }
.action .arrow { color: var(--highlight); }
.action.primary { color: #211b29; background: var(--highlight); border-color: var(--highlight); }
.action.primary:hover { color: #211b29; background: #fff1df; }
.action.primary .arrow { color: #392b47; }
.choice-index { color: var(--highlight); background: #ffffff14; }
.choice-hint { color: var(--soft); }

.game-nav {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 7px;
  margin-top: 13px; padding: 6px; border: 1px solid var(--edge); border-radius: 16px;
  background: #161321ed; position: sticky; bottom: 8px; z-index: 4;
  box-shadow: 0 5px 24px #08081355;
}
.game-nav button {
  min-width: 0; min-height: 44px; border: 0; border-radius: 11px; padding: 4px;
  background: transparent; color: var(--soft); white-space: nowrap; font-size: 13px;
}
.game-nav button span { color: var(--highlight); margin-right: 3px; font-size: 16px; }
.game-nav button[aria-pressed="true"] { background: #ffffff12; color: #fff7ed; font-weight: 700; }
.game-nav button:hover { background: #ffffff18; color: #fff7ed; }
.game-nav small { color: var(--highlight); margin-left: 2px; }
.game-footer { color: var(--soft); }
.library-panel { min-height: 440px; }
.library-panel h2 { margin-bottom: 12px; }
.library-content { overflow: auto; max-height: 440px; padding-right: 4px; }
.empty-state { color: var(--soft); }
.library-panel .memory { color: var(--ink); border-color: var(--edge); background: #ffffff09; }
.library-panel .memory summary { color: var(--ink); }
.library-panel .memory.locked { color: var(--soft); }
.library-panel .message-thread h3, .library-panel .modal-section { color: var(--highlight); }
.library-panel .message-thread + .message-thread { border-color: var(--edge); }
.library-panel .message-thread p { color: var(--ink); background: #ffffff0e; }
.library-panel .message-thread .outgoing { background: #e5d4ea; color: #302039; }
.replay-button { margin-top: 8px; border: 1px solid var(--edge); border-radius: 7px; padding: 5px 9px; color: var(--highlight); background: transparent; }
.game-modal { color: #302039; }
.game-modal .modal-rule strong { color: #5f376b; }
.replay { white-space: pre-line; line-height: 1.85; }

@media (max-width: 960px) {
  .game-layout { grid-template-columns: minmax(0, 1.45fr) minmax(285px, 1fr); gap: 12px; }
  .scene { min-height: 490px; }
  .dialogue { padding: 23px 19px 18px; }
}
@media (max-width: 680px) {
  .header-content { min-height: 54px; }
  .intro { padding-block: 15px 13px; }
  .intro h1 { font-size: 36px; }
  .route-button { min-height: 31px; padding: 4px 10px; font-size: 11px; }
  .game-layout { display: block; }
  .scene { min-height: 0; height: clamp(222px, 65vw, 347px); border-radius: 16px; }
  .scene[data-route="cat"] .character,
  .scene[data-route="cat"] .character[data-study="true"] { width: min(66%, 255px); height: 90%; object-fit: contain; right: 5%; bottom: 4%; }
  .dialogue { padding: 16px; }
  .home-panel h2 { font-size: 36px; margin: 4px 0 8px; }
  .home-line { min-height: 3.5em; margin-bottom: 8px; font-size: 14px; }
  .home-progress { padding: 12px 0 10px; }
  .home-progress p { margin-bottom: 6px; }
  .interaction { min-height: 40px; }
  .game-nav { margin-top: 9px; border-radius: 13px; gap: 1px; padding: 4px; bottom: 4px; }
  .game-nav button { min-height: 42px; font-size: 12px; }
  .game-nav button span { margin-right: 0; font-size: 13px; }
  .library-content { max-height: none; }
  .library-panel { min-height: 300px; }
  #main[data-view="letters"] .scene, #main[data-view="journal"] .scene { display: none; }
}

</style>

      .map(([key]) => [key, saved.choices[key]]));
    const replies = Object.fromEntries(Object.entries(letters)
      .filter(([id, letter]) => letter.replies && Object.hasOwn(letter.replies, saved.replies?.[id]))
      .map(([id]) => [id, saved.replies[id]]));
    return {
      node, choices, replies, unlocked: knownItems(saved.unlocked, endings),
      memories: knownItems(saved.memories, memories), letters: knownItems(saved.letters, letters),
    };
  }

  function sceneFor(state) {
    const scene = scenes[state.node];
    const line = scene.letter ? letters[scene.letter].text : scene.line;
    return { ...scene, line: typeof line === "function" ? line(state) : line };
  }

  function restart(state) {
    return { ...state, node: "arrive", choices: {} };
  }

  function choose(state, index) {
    const current = scenes[state.node];
    const action = current.actions[index];
    if (!action) return state;
    if (action.next === "arrive") return restart(state);
    const node = typeof action.next === "function" ? action.next(state) : action.next;
    const choices = action.choice ? { ...state.choices, [action.choice[0]]: action.choice[1] } : state.choices;
    const replies = current.letter && action.choice
      ? { ...state.replies, [current.letter]: action.choice[1] } : state.replies;
    const next = scenes[node];
    return {
      node, choices, replies, unlocked: collect(state.unlocked, next.ending),
      memories: collect(state.memories, next.memory), letters: collect(state.letters, next.letter),
    };
  }

  return { chapters, endings, memories, letters, restore, sceneFor, restart, choose };
}

      "蛋糕店的门外还有一小段走廊。靠垫后面响了一声。你循声过去，看到有人踮着脚，把一条浅蓝小鱼挂到毯角。",
      next("走到失物招领处", "key-request")),
    "key-request": entry(0, "林小猫",
      "你是来找钥匙扣的吗？我刚从靠垫底下捡出三件。\n你说那只系着蓝绳，鱼尾的蓝漆下面还有一道白划痕。",
      [
        { label: "金属圆环，系着红绳", next: "key-retry" },
        { label: "蓝绳鱼尾，尾尖有一道白痕", next: "key-found" },
        { label: "浅蓝鱼铃，背面有一道刻痕", next: "key-retry" },
      ]),
    "key-retry": entry(0, "林小猫",
      "先看绳子，再看看鱼尾。那一笔白色是在漆下面，你把它翻过来一点就看见了。",
      next("再看一眼", "key-request")),
    "key-found": entry(0, "林小猫",
      "她把钥匙扣推到你手边，眼睛还藏在毯边。\n「你摸摸看，是不是这个？」\n你点头时，她才从毯子后站起来，踮脚让你试了一下那条小鱼铃。",
      next("第二夜再来", "ledger-message"), { memory: "key" }),
    "ledger-message": reply(1, "ledger", "second", ["ledger-together", "ledger-soon"]),
    "ledger-together": entry(1, "林小猫",
      "她把小书桌往亮处拖了拖，把自己的本子翻到一半。「我写得有点乱。你站这边，和我一起看。」",
      next("翻开登记簿", "ledger-clue")),
    "ledger-soon": entry(1, "林小猫",
      "你到的时候，她还站在书桌边，食指压着那页。「你来了。我刚看到同一个地方两次。」",
      next("翻开登记簿", "ledger-clue")),
    "ledger-clue": entry(1, "林小猫",
      "认领人写的是「封口是蓝纸，左下角折成了三角」。她把抽屉里的三只信封排成一行，等你来选。",
      [
        { label: "蓝纸封口，右下角有折痕", next: "ledger-retry" },
        { label: "白纸封口，左下角折成三角", next: "ledger-retry" },
        { label: "蓝纸封口，左下角折成三角", next: "ledger-found" },
      ]),
    "ledger-retry": entry(1, "林小猫",
      "她把认领单转到你面前，用笔尖点了两下。「蓝色的封口，还有左下角。两样都对才行。」",
      next("重新核对", "ledger-clue")),
    "ledger-found": entry(1, "林小猫",
      "她站在小书桌边，把你找到的两条线索认真记进本子。写完最后一笔，她把纸往你这边转了半圈。\n「这里留给你签字。今晚是我们一起找到的。」",
      next("在她名字旁签字", "bell-message"), { portrait: "cat-study", memory: "study" }),
    "bell-message": reply(2, "bell", "third", ["bell-stay", "bell-door"]),
    "bell-stay": entry(2, "林小猫",
      "她把小鱼铃从毯角解下来，攥了一会儿，才松开手。「你来了就好。待会儿我想亲手给他。」",
      next("陪她等失主", "bell-owner")),
    "bell-door": entry(2, "林小猫",
      "你把人领到走廊拐角。林小猫站在灯下，手心里躺着小鱼铃。她抬眼看了看你，往前迈了一步。",
      next("把地方让给他们", "bell-owner")),
    "bell-owner": entry(2, "旁白",
      "来的人准确指出了鱼尾缺漆的那一角。林小猫把铃递过去。那人摇了一下，果然只响半声。他把铃系回毯角。\n「我已经找到它了。留在你这儿吧，下次来找东西我也知道怎么叫你。」",
      next("听小鱼铃再响一次", "bell-promise"), { lights: 1, memory: "chime" }),
    "bell-promise": entry(2, "林小猫",
      "门外最后一扇窗开始往里合。她把铃往毯子外挪了一点，声音放得很轻。\n「你明晚……没有丢东西也会来吗？」",
      [
        { label: "会。我明晚是来找你的。", next: "ending-visit" },
        { label: "下次路过，我就摇铃跟你打招呼。", next: "ending-note" },
      ], { lights: 1 }),
    "ending-visit": entry(2, "旁白", endings.visit.line, next("从第一夜重玩", "arrive"), { ...endings.visit, ending: "visit", lights: 0 }),
    "ending-note": entry(2, "旁白", endings.note.line, next("从第一夜重玩", "arrive"), { ...endings.note, ending: "note", lights: 0 }),
  };
  return makeStory({
    chapters, endings, memories, letters, scenes,
    choiceValues: { second: ["together", "soon"], third: ["stay", "door"] },
  });
})();


const routes = {
  bao: {
    name: "林小包", place: "半格蛋糕店", location: "屏幕下沿 · 半格蛋糕店",
    portrait: "lin-welcome", background: "shop", story: baoStory,
    key: "half-pixel-cake-shop:story:v1",
    greeting: "「想坐就坐。蛋糕先给你留着。」",
    emptyMail: "第三夜结束后，她会发来第一条私信。",
    interactions: [
      { label: "尝一口蛋糕", portrait: "lin-guard", line: "「就一小口。」她把更大的那块往你这边推了推。" },
      { label: "陪她坐一会儿", portrait: "lin-blush", line: "她把两把椅子往一起挪。「这样说话省力。」" },
    ],
    clips: { umbrella: "rain-date", cups: "cups-date", sign: "sign-listen" },
  },
  cat: {
    name: "林小猫", place: "失物招领处", location: "夜街拐角 · 失物招领处",
    portrait: "cat-stand", background: "cat-room", story: catStory,
    key: "half-pixel-cake-shop:cat:v1",
    greeting: "「你摸摸看，是不是这个？」",
    emptyMail: "第一夜结束后，她会发来第一条私信。",
    interactions: [
      { label: "摇摇小鱼铃", portrait: "cat-stand", line: "铃只响了半声。她耳朵动了一下。「我听见了。是你呀。」" },
      { label: "陪她做笔记", portrait: "cat-study", line: "她把招领簿往你这边推了一点。「你念慢一点，我写得过来。」" },
    ],
    clips: { key: "key-found", study: "ledger-found", chime: "bell-owner" },
  },
};

const ACTIVE_KEY = "half-pixel-cake-shop:active-character";
const get = (id) => document.getElementById(id);
const imageUrl = (name) => embeddedImages[name];
const stage = get("scene");
const sceneArt = get("scene-art");
const character = get("character");
const windows = get("windows");
const storyText = get("story");
const actions = get("actions");
const modal = get("modal");
const windowNames = ["两扇窗都熄了", "一扇窗亮着", "两扇窗亮着"];
let storage = true;
const progress = Object.fromEntries(Object.entries(routes).map(([id, route]) => [id, readProgress(route)]));
const previousRoute = readStorage(ACTIVE_KEY);
let active = Object.hasOwn(routes, previousRoute) ? previousRoute : "bao";
let view = "home";
let encounter = null;

function readStorage(key) {
  try {
    return localStorage.getItem(key);
  } catch {
    storage = false;
    return null;
  }
}

function readProgress(route) {
  try {
    return route.story.restore(JSON.parse(readStorage(route.key)));
  } catch {
    return route.story.restore(null);
  }
}

function save() {
  try {
    if (storage) {
      localStorage.setItem(ACTIVE_KEY, active);
      localStorage.setItem(routes[active].key, JSON.stringify(progress[active]));
    }
  } catch {
    storage = false;
  }
  if (!storage) get("save-status").textContent = "进度仅保留到本页关闭";
}

function node(tag, className, label) {
  const element = document.createElement(tag);
  if (className) element.className = className;
  if (label) element.textContent = label;
  return element;
}

function button(label, onClick, className = "action") {
  const control = node("button", className, label);
  control.type = "button";
  control.addEventListener("click", onClick);
  return control;
}

function actionButton(label, onClick, index = null) {
  const control = button("", onClick, index === null ? "action primary" : "action");
  if (index !== null) {
    const number = node("span", "choice-index", String(index + 1));
    number.setAttribute("aria-hidden", "true");
    control.append(number);
  }
  const arrow = node("span", "arrow", "→");
  arrow.setAttribute("aria-hidden", "true");
  control.append(node("span", "", label), arrow);
  return control;
}

function selectView(next, moveFocus = true) {
  view = next;
  encounter = null;
  render();
  if (!moveFocus) return;
  const heading = get(view === "home" ? "home-name" : view === "story" ? "chapter-title" : "library-title");
  heading.tabIndex = -1;
  heading.focus({ preventScroll: true });
  if (matchMedia("(max-width: 680px)").matches && view !== "home") {
    heading.scrollIntoView({ block: "nearest" });
  }
}

function advance(index) {
  const state = progress[active];
  const next = routes[active].story.choose(state, index);
  if (next === state) return;
  progress[active] = next;
  save();
  render();
  storyText.tabIndex = -1;
  storyText.focus({ preventScroll: true });
}

function renderTrack(id, chapters, current) {
  get(id).replaceChildren(...chapters.map((chapter, index) => {
    const step = node("span", index === current ? "current" : index < current ? "visited" : "");
    step.setAttribute("aria-label", chapter.label);
    if (index === current) step.setAttribute("aria-current", "step");
    return step;
  }));
}

function renderStage(route, scene) {
  const lights = scene?.lights ?? 2;
  const background = scene?.background ?? route.background;
  const portrait = scene?.portrait ?? encounter?.portrait ?? route.portrait;
  const cake = portrait === "cake";
  stage.dataset.lights = lights;
  stage.dataset.featured = String(Boolean(scene?.background));
  stage.dataset.route = active;
  stage.setAttribute("aria-label", route.place);
  if (sceneArt.dataset.art !== background) {
    sceneArt.src = imageUrl(background);
    sceneArt.dataset.art = background;
    sceneArt.alt = scene?.background ? "雨夜的蛋糕店里，林小包把两只杯子推到桌边" : "";
  }
  character.hidden = cake || Boolean(scene?.background);
  if (!character.hidden && character.dataset.portrait !== portrait) {
    character.src = imageUrl(portrait);
    character.dataset.portrait = portrait;
    character.alt = route.name;
  }
  character.dataset.study = String(portrait === "cat-study");
  get("scene-location").textContent = route.location;
  get("shop-state").textContent = scene?.ending ? "已打烊" : lights ? "灯还亮着" : "正在打烊";
  windows.setAttribute("aria-label", windowNames[lights]);
  [...windows.children].forEach((item, index) => item.classList.toggle("lit", index < lights));
  get("cake-moment").hidden = !cake;
  get("cake-berry").classList.toggle("placed", Boolean(scene?.berry));
}

function renderHome(route, scene, state) {
  const chapter = route.story.chapters[scene.chapter];
  get("home-location").textContent = route.place;
  get("home-name").textContent = route.name;
  get("home-line").textContent = encounter?.line ?? route.greeting;
  get("home-interactions").replaceChildren(...route.interactions.map((moment) =>
    button(moment.label, () => {
      encounter = moment;
      get("home-line").textContent = moment.line;
      renderStage(route, null);
    }, "interaction")
  ));
  get("home-progress").textContent = state.node === "arrive"
    ? `个人线 · 共 ${route.story.chapters.length} 夜`
    : `${chapter.label} · ${scene.ending ? "已收录结局" : chapter.title}`;
  renderTrack("home-track", route.story.chapters, scene.chapter);
  get("home-action").replaceChildren(actionButton(state.node === "arrive" ? "开始剧情" : "继续剧情", () => selectView("story")));
}

function renderStory(route, scene) {
  const chapter = route.story.chapters[scene.chapter];
  const letter = route.story.letters[scene.letter];
  const hasChoices = scene.actions.length > 1;
  renderTrack("chapter-track", route.story.chapters, scene.chapter);
  get("chapter-label").textContent = scene.ending ? "结局已收录" : chapter.label;
  get("chapter-title").textContent = scene.ending ? scene.title : chapter.title;
  get("speaker-name").textContent = scene.speaker;
  get("speaker").dataset.character = String(scene.speaker === route.name);
  get("letter-heading").hidden = !letter;
  get("letter-heading").textContent = letter?.title ?? "";
  storyText.classList.toggle("story-letter", Boolean(letter));
  get("line").textContent = scene.line;
  actions.replaceChildren(...scene.actions.map((action, index) =>
    actionButton(action.label, () => advance(index), hasChoices ? index : null)
  ));
  get("choice-hint").hidden = !hasChoices;
}

function artCard(name, alt) {
  const artwork = node("img", "memory-art");
  artwork.alt = alt;
  artwork.src = imageUrl(name);
  return artwork;
}

function renderLetters(route, state, scene) {
  const entries = Object.entries(route.story.letters)
    .filter(([id]) => state.letters.includes(id))
    .map(([id, letter]) => {
      const message = node("article", "message-thread");
      message.append(node("h3", "", letter.title), node("p", "incoming", letter.text));
      const reply = letter.replies?.[state.replies[id]];
      if (reply) message.append(node("p", "outgoing", reply));
      if (scene.letter === id && letter.replies) {
        message.append(actionButton("回到剧情回信", () => selectView("story")));
      }
      return message;
    });
  return entries.length ? entries : [node("p", "empty-state", route.emptyMail)];
}

function renderJournal(route, state) {
  const dates = Object.entries(route.story.memories).map(([id, memory]) => {
    if (!state.memories.includes(id)) return node("p", "memory locked", `${memory.title} · 待解锁`);
    const entry = node("details", "memory");
    entry.append(node("summary", "", memory.title));
    if (memory.art) entry.append(artCard(memory.art, memory.title));
    entry.append(node("p", "", memory.line));
    const clip = route.story.sceneFor({ ...state, node: route.clips[id] });
    entry.append(button("重看片段", () => {
      openModal(memory.title, node("p", "replay", clip.line));
    }, "replay-button"));
    return entry;
  });
  const endings = Object.entries(route.story.endings).map(([id, ending], index) => {
    if (!state.unlocked.includes(id)) return node("p", "memory locked", `结局 ${index + 1} · 待解锁`);
    const entry = node("details", "memory");
    entry.append(node("summary", "", ending.title), node("p", "", ending.line));
    return entry;
  });
  return [node("h3", "modal-section", "相遇与约会"), ...dates, node("h3", "modal-section", "故事结局"), ...endings];
}

function render() {
  const route = routes[active];
  const state = progress[active];
  const scene = route.story.sceneFor(state);
  const library = view === "letters" || view === "journal";
  get("main").dataset.view = view;
  document.body.dataset.route = active;
  get("home-panel").hidden = view !== "home";
  get("story-panel").hidden = view !== "story";
  get("library-panel").hidden = !library;
  renderStage(route, view === "story" ? scene : null);
  if (view === "home") renderHome(route, scene, state);
  if (view === "story") renderStory(route, scene);
  if (library) {
    get("library-character").textContent = route.name;
    get("library-title").textContent = view === "letters" ? "私信" : "回忆簿";
    get("library-content").replaceChildren(...(view === "letters"
      ? renderLetters(route, state, scene) : renderJournal(route, state)));
  }
  [...get("routes").children].forEach((control) =>
    control.setAttribute("aria-pressed", String(control.dataset.route === active))
  );
  [...get("game-nav").children].forEach((control) =>
    control.setAttribute("aria-pressed", String(control.dataset.view === view))
  );
  const collected = state.memories.length + state.unlocked.length;
  get("letter-count").textContent = state.letters.length;
  get("letter-count").hidden = !state.letters.length;
  get("journal-count").textContent = collected;
  get("journal-count").hidden = !collected;
  get("restart").hidden = state.node === "arrive" || view !== "story";
}

function openModal(title, ...contents) {
  get("modal-title").textContent = title;
  get("modal-body").replaceChildren(...contents);
  modal.showModal();
}

for (const [id, route] of Object.entries(routes)) {
  const control = button(route.name, () => {
    active = id;
    save();
    selectView("home", false);
  }, "route-button");
  control.dataset.route = id;
  get("routes").append(control);
}

get("game-nav").addEventListener("click", (event) => {
  const control = event.target.closest("button[data-view]");
  if (control) selectView(control.dataset.view);
});

get("home-link").addEventListener("click", (event) => {
  event.preventDefault();
  selectView("home");
});

get("about").addEventListener("click", () => {
  const rules = [
    ["门借一盏灯", "两扇窗里只要还有一扇亮着，入口就留在原处。最后一扇合上，里面的灯会亮到客人走出去。"],
    ["坐过就留一颗莓", "林小包为每位坐过的客人留一颗蓝莓。同一晚回来，也还是原来那颗。"],
    ["失物从靠垫下来", "最后一个人离开沙发后，掉进去的东西会滑到林小猫的毛毯上。说出一处独特的细节，就可以认领。"],
  ];
  openModal("夜街规矩", ...rules.map(([heading, detail]) => {
    const paragraph = node("p", "modal-rule");
    paragraph.append(node("strong", "", heading), detail);
    return paragraph;
  }));
});

get("restart").addEventListener("click", () => {
  openModal("重新开始", node("p", "", "本路线回到第一夜。已收录的回忆、结局和私信会保留。"),
    actionButton("回到第一夜", () => {
      progress[active] = routes[active].story.restart(progress[active]);
      save();
      modal.close();
      selectView("story");
    }));
});

document.addEventListener("keydown", (event) => {
  if (view !== "story" || modal.open || event.repeat || event.altKey || event.ctrlKey || event.metaKey) return;
  const index = Number(event.key) - 1;
  if (actions.children.length > 1 && /^[1-3]$/.test(event.key) && index < actions.children.length) {
    event.preventDefault();
    advance(index);
  }
});

save();
render();

})();
</script>
</body>
