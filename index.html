<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#181321">
  <meta name="description" content="深夜，你推开一扇藏在屏幕缝里的门。到蛋糕店见林小包，去招领处找林小猫，也可以去棕榈温室陪林小芽等雨停。">
  <title>半格蛋糕店</title>
  <link rel="icon" href="./releases/b8969fab70ac7d93/assets/cake.webp" type="image/webp">
  <link rel="preload" href="./releases/b8969fab70ac7d93/assets/shop.webp" as="image">
  <link rel="stylesheet" href="./releases/b8969fab70ac7d93/style.css">
  <script defer src="./releases/b8969fab70ac7d93/game.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="shell header-content">
      <a class="brand" href="./" aria-label="半格蛋糕店首页" id="home-link">
        <span class="brand-mark"><img src="./releases/b8969fab70ac7d93/assets/cake.webp" alt="" width="37" height="37"></span>
        <span>半格蛋糕店</span>
      </a>
      <div class="route-picker" id="routes" role="group" aria-label="切换剧情路线"></div>
    </div>
  </header>

  <main class="shell" id="main" data-view="home">
    <header class="intro">
      <h1>半格蛋糕店</h1>
      <p class="subtitle">今晚，想去见谁？也可以和她们一起逛夜街。</p>
      <div class="event-picker" id="event-picker" role="group" aria-label="选择双人事件" hidden></div>
    </header>

    <div class="game-layout">
      <section class="scene" id="scene" aria-label="半格蛋糕店内的场景">
        <img class="scene-background" id="scene-art" src="./releases/b8969fab70ac7d93/assets/shop.webp" alt="" width="1536" height="1024" fetchpriority="high">
        <div class="scene-shade"></div>
        <div class="scene-status">
          <span class="shop-status"><span class="status-light" aria-hidden="true"></span><span id="shop-state">夜间营业</span></span>
          <span class="windows" id="windows" aria-label="两扇窗亮着">
            <span class="window-icon lit" aria-hidden="true"></span>
            <span class="window-icon lit" aria-hidden="true"></span>
          </span>
        </div>
        <img class="character" id="character" src="./releases/b8969fab70ac7d93/assets/lin-welcome.webp" alt="抱着蓝莓蛋糕的林小包" width="512" height="512">
        <img class="character partner" id="partner" alt="" width="512" height="512" hidden>
        <div class="cake-moment" id="cake-moment" hidden>
          <img src="./releases/b8969fab70ac7d93/assets/cake.webp" alt="放在牛皮纸上的蓝莓奶油蛋糕" width="570" height="570">
          <span class="cake-berry" id="cake-berry" aria-hidden="true"></span>
        </div>
        <div class="scene-caption"><span class="caption-pin" aria-hidden="true"></span> <span id="scene-location">屏幕下沿 · 半格蛋糕店</span></div>
      </section>

      <section class="dialogue home-panel" id="home-panel" aria-labelledby="home-name">
        <p class="chapter-label" id="home-location">半格蛋糕店</p>
        <h2 id="home-name">林小包</h2>
        <p class="home-line" id="home-line" aria-live="polite">「想坐就坐。蛋糕先给你留着。」</p>
        <div id="home-interactions" class="home-interactions" aria-label="相伴互动"></div>
        <div class="home-progress">
          <p id="home-progress"></p>
          <div class="chapter-track" id="home-track" aria-label="个人线进度"></div>
        </div>
        <div id="home-action"><p class="startup-progress" role="status">正在加载剧情…</p></div>
      </section>

      <section class="dialogue" id="story-panel" aria-label="剧情与选项" hidden>
        <div class="chapter-track" id="chapter-track" aria-label="个人线进度"></div>
        <div id="story" class="story" aria-live="polite" aria-atomic="true">
          <p class="chapter-label" id="chapter-label">第一夜</p>
          <h2 id="chapter-title">借一把椅子</h2>
          <div class="speaker" id="speaker"><span class="speaker-mark" aria-hidden="true"></span><span id="speaker-name">旁白</span></div>
          <p class="letter-heading" id="letter-heading" hidden></p>
          <p id="line" class="line">夜里，两扇窗口挨近。屏幕下沿多出一扇玻璃门，里面有人抱着蛋糕，快睡着了。</p>
        </div>
        <div class="actions" id="actions">
          <button type="button" class="action primary"><span>推门进去</span><span aria-hidden="true">→</span></button>
        </div>
        <p class="choice-hint" id="choice-hint" hidden>也可以按数字键选择</p>
        <button type="button" class="interaction desk-entry" id="story-desk" hidden>帮她整理剩下的失物</button>
      </section>
      <section class="dialogue library-panel" id="library-panel" aria-labelledby="library-title" hidden>
        <p class="chapter-label" id="library-character"></p>
        <h2 id="library-title"></h2>
        <div id="library-content" class="library-content"></div>
      </section>
    </div>
    <div class="game-controls">
      <nav class="game-nav" id="game-nav" aria-label="游戏导航">
        <button type="button" data-view="home"><span aria-hidden="true">◈</span> 相伴</button>
        <button type="button" data-view="story"><span aria-hidden="true">▤</span> 剧情</button>
        <button type="button" data-view="letters"><span aria-hidden="true">✉</span> 私信 <small id="letter-count" hidden></small></button>
        <button type="button" data-view="journal"><span aria-hidden="true">✦</span> 回忆 <small id="journal-count" hidden></small></button>
      </nav>
      <div class="chapter-controls" role="group" aria-label="章节控制">
        <button type="button" class="quiet-button" id="chapters">选章节</button>
        <button type="button" class="quiet-button" id="restart">从头开始</button>
        <button type="button" class="quiet-button" id="exit-replay" hidden>回到主线</button>
      </div>
    </div>
    <footer class="game-footer">
      <p id="save-status"><span class="save-dot" aria-hidden="true"></span> 剧情进度保存在当前浏览器</p>
      <div>
        <button type="button" class="quiet-button" id="sound-toggle">开启音效</button>
        <button type="button" class="quiet-button" id="about">夜街规矩</button>
      </div>
    </footer>
  </main>

  <dialog class="game-modal" id="modal" aria-labelledby="modal-title">
    <div class="modal-top">
      <h2 id="modal-title"></h2>
      <form method="dialog"><button type="submit" class="close-button" aria-label="关闭">×</button></form>
    </div>
    <div id="modal-body"></div>
  </dialog>
  <dialog class="game-modal lost-desk" id="lost-desk" aria-labelledby="lost-desk-title">
    <div class="modal-top">
      <h2 id="lost-desk-title">失物整理</h2>
      <form method="dialog"><button type="submit" class="close-button" aria-label="关闭失物整理">×</button></form>
    </div>
    <p class="pair-instruction">翻开两张牌，把失物和写着对应特征的认领单配成对。</p>
    <p class="pair-status" role="status"></p>
    <div class="pair-board" role="group" aria-label="失物和认领单"></div>
    <div class="pair-result" tabindex="-1" hidden>
      <strong>林小猫给你留了值班牌</strong>
      <p>「你哪天想陪我整理，就把这张牌往桌上一放。」</p>
      <p>可以在林小猫的回忆簿重看这段对话。</p>
    </div>
    <button type="button" class="pair-restart">重新洗牌</button>
  </dialog>
  <noscript><p class="noscript">开启浏览器的 JavaScript 后就能进入蛋糕店。</p></noscript>
</body>
</html>
