  <style>
:root {
  color-scheme: dark;
  --ink: #302039;
  --cream: #fbf2e8;
  --muted: #c5b5c8;
  --gold: #edc997;
  --plum: #5f376b;
  --sans: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", system-ui, sans-serif;
  --serif: "Songti SC", "STSong", "Noto Serif CJK SC", "SimSun", serif;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0;
  min-width: 290px;
  min-height: 100vh;
  color: var(--cream);
  font: 15px/1.6 var(--sans);
  background: radial-gradient(ellipse at 48% -22%, #412a46 0, #24192c 36%, #17121f 76%);
}
button, a { -webkit-tap-highlight-color: transparent; }
button { font: inherit; cursor: pointer; }
button:focus-visible, a:focus-visible {
  outline: 3px solid #b489e4;
  outline-offset: 4px;
}
.shell { width: min(1232px, 100% - 80px); margin-inline: auto; }
.site-header { border-bottom: 1px solid #f5ded51c; background: #1a1421a8; }
.header-content {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 18px;
  min-height: 71px;
}
.brand { display: inline-flex; align-items: center; gap: 11px; color: var(--cream); text-decoration: none; font-weight: 700; white-space: nowrap; }
.brand-mark { display: grid; width: 40px; height: 40px; place-items: center; border: 1px solid #b78a8450; border-radius: 12px; background: #382538; }
.brand-mark img { width: 30px; height: 30px; object-fit: contain; }
.header-content nav { display: flex; align-items: center; gap: 10px; }
.nav-button, .quiet-button {
  border: 1px solid transparent;
  border-radius: 9px;
  color: #e1d3dd;
  background: transparent;
  min-height: 40px;
  padding: 7px 13px;
  font-size: 13px;
  white-space: nowrap;
}
.nav-button:hover, .quiet-button:hover { background: #e0cae713; color: #fff3e9; }
.journal-button { border-color: #edd3ec37; background: #38293f; }
.journal-button span { margin-left: 6px; color: #eac794; font-size: 12px; font-variant-numeric: tabular-nums; }

.intro { padding-block: 34px 25px; }
.eyebrow { margin: 0 0 5px; color: var(--gold); font-size: 12px; letter-spacing: .14em; }
.eyebrow span { margin-right: 6px; font-size: 14px; }
h1, h2, p { margin-top: 0; }
h1 {
  margin: 0;
  font: 700 clamp(40px, 5vw, 67px)/1.14 var(--serif);
  letter-spacing: .055em;
  color: #fff3e8;
  text-shadow: 0 2px 20px #130b15;
}
.subtitle { margin: 12px 0 0; color: #dbcbd7; font-size: 15px; }

.game-layout { display: grid; grid-template-columns: minmax(0, 2.15fr) minmax(305px, 1fr); gap: 19px; }
.scene {
  isolation: isolate;
  min-width: 0;
  position: relative;
  min-height: 530px;
  overflow: hidden;
  border: 1px solid #e2c19d52;
  border-radius: 22px;
  background: #362636;
  box-shadow: 0 18px 44px #0f09166b;
}
.scene-background, .scene-shade { position: absolute; width: 100%; height: 100%; inset: 0; }
.scene-background { object-fit: cover; object-position: 53% 55%; z-index: -3; transition: filter .7s ease; }
.scene[data-lights="1"] .scene-background { filter: brightness(.82) saturate(.9); }
.scene[data-lights="0"] .scene-background { filter: brightness(.58) saturate(.72); }
.scene-shade { z-index: -2; background: linear-gradient(180deg,#110b1b51 0, transparent 27%, transparent 70%,#130b19c7 100%); pointer-events: none; }
.scene-status { position: absolute; inset: 17px 18px auto; display: flex; justify-content: space-between; align-items: center; gap: 8px; z-index: 2; }
.shop-status, .windows {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  min-height: 33px;
  border-radius: 30px;
  padding: 5px 12px;
  font-size: 12px;
  color: #ffe8ca;
  border: 1px solid #f8d9b642;
  background: #211628dc;
}
.status-light, .save-dot {
  display: inline-block;
  border-radius: 50%;
  width: 7px;
  height: 7px;
  background: #e9bb79;
  box-shadow: 0 0 8px #efb666a0;
}
.scene[data-lights="0"] .status-light { background: #9f8aab; box-shadow: none; }
.window-icon {
  display: block;
  width: 12px;
  height: 13px;
  border: 1px solid #a798ac;
  border-radius: 2px;
  color: #a798ac;
  background: linear-gradient(90deg,transparent 45%,currentColor 45% 55%,transparent 55%),
              linear-gradient(0deg,transparent 45%,currentColor 45% 55%,transparent 55%);
}
.window-icon.lit {
  color: #946b4d;
  border-color: #f1cf9c;
  background-color: #f1cf9c;
  box-shadow: 0 0 9px #efb66680;
}
.scene-caption {
  position: absolute;
  bottom: 19px;
  left: 20px;
  color: #fff0db;
  font-size: 12px;
  text-shadow: 0 2px 5px #100a13;
}
.caption-pin { display: inline-block; width: 9px; height: 9px; margin-right: 5px; border: 1px solid #f0c990; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); }
.character {
  position: absolute;
  right: 8%;
  bottom: 15%;
  width: min(42%, 350px);
  height: auto;
  filter: drop-shadow(0 13px 17px #150a1c8a);
  animation: appear .33s ease-out both;
}
@keyframes appear { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
.cake-moment {
  position: absolute;
  width: clamp(160px, 35%, 290px);
  right: 10%;
  bottom: 14%;
  filter: drop-shadow(0 12px 18px #1b102acc);
  animation: appear .3s ease-out both;
}
.cake-moment img { display: block; width: 100%; height: auto; }
.cake-berry {
  display: none;
  position: absolute;
  left: 48%;
  top: 28%;
  width: 12%;
  aspect-ratio: 1;
  border-radius: 48%;
  border: 1px solid #1c122e;
  background: radial-gradient(circle at 46% 34%, #b7a2e8 0 8%, #78609a 14% 24%, #443564 54%, #1f182d 85%);
  box-shadow: 0 1px 4px #0b0613ad, 0 0 13px #cfb1ed90;
}
.cake-berry.placed { display: block; animation: appear .45s ease-out both; }

.dialogue {
  min-width: 0;
  display: flex;
  flex-direction: column;
  padding: 30px 28px 23px;
  border: 1px solid #ebd1c9;
  border-radius: 22px;
  background: linear-gradient(146deg,#fff7ed,#f3e5e6);
  color: var(--ink);
  box-shadow: 0 18px 44px #0f091644;
}
.chapter-track { display: flex; gap: 6px; }
.chapter-track span { flex: 1; height: 3px; border-radius: 4px; background: #ddcbd7; }
.chapter-track .visited { background: #b894bd; }
.chapter-track .current { background: #794983; }
.story { flex: 1; padding-block: 23px 14px; }
.chapter-label { margin: 0 0 4px; color: #75477d; font-size: 13px; font-weight: 700; letter-spacing: .14em; }
.story h2 {
  font: 700 clamp(25px, 2.5vw, 35px)/1.24 var(--serif);
  color: #331f37;
  margin: 0 0 24px;
}
.speaker {
  display: flex;
  align-items: center;
  gap: 7px;
  color: #704879;
  font-size: 13px;
  font-weight: 700;
}
.speaker-mark { width: 7px; height: 7px; border-radius: 2px; transform: rotate(45deg); background: #9672a0; }
.speaker[data-character="true"] .speaker-mark { background: #ab743c; }
.line {
  margin: 9px 0 0;
  min-height: 5.3em;
  white-space: pre-line;
  line-height: 1.86;
  font-size: 15px;
  color: #49374c;
}
.actions { display: grid; gap: 8px; }
.action {
  display: flex;
  align-items: center;
  gap: 9px;
  width: 100%;
  min-height: 50px;
  padding: 10px 12px;
  border: 1px solid #d8becf;
  border-radius: 10px;
  color: #432a49;
  background: #fffbf8ba;
  text-align: left;
  line-height: 1.43;
  font-size: 13px;
  font-weight: 700;
  transition: background-color .16s, transform .16s, border-color .16s;
}
.action:hover { background: #fff9ff; border-color: #aa7aac; transform: translateY(-1px); }
.action.primary { min-height: 53px; color: #fff5f0; border-color: #66396f; background: #62396f; }
.action.primary:hover { background: #784680; }
.action .arrow { margin-left: auto; padding-left: 4px; color: #9d779f; }
.action.primary .arrow { color: #f4d8bd; }
.choice-index {
  display: grid;
  width: 22px;
  height: 22px;
  flex: 0 0 22px;
  place-items: center;
  border-radius: 6px;
  color: #714878;
  background: #eadbe9;
  font-size: 11px;
}
.choice-hint { margin: 9px 0 0; color: #705b72; text-align: right; font-size: 11px; }
.game-footer { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 12px; padding-bottom: 24px; color: var(--muted); font-size: 12px; }
.game-footer p { margin: 0; }
.game-footer .save-dot { width: 5px; height: 5px; margin-right: 4px; background: #b69ac3; box-shadow: none; }
.quiet-button { color: var(--muted); min-height: 36px; font-size: 12px; }

.game-modal {
  color-scheme: light;
  width: min(540px, 100% - 28px);
  padding: 24px;
  max-height: calc(100dvh - 30px);
  overflow: auto;
  color: var(--ink);
  border: 1px solid #d9bcca;
  border-radius: 18px;
  background: #fff5ed;
  box-shadow: 0 14px 60px #1008169a;
}
.game-modal::backdrop { background: #0f0817b8; backdrop-filter: blur(4px); }
.modal-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
.modal-top h2 { margin: 0; font: 700 30px/1.3 var(--serif); }
.close-button { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 8px; border: 1px solid #e2cddc; background: #f2e4ec; color: var(--ink); font-size: 23px; }
.close-button:hover { background: #ead8e6; }
.modal-rule { margin: 0 0 15px; }
.modal-rule strong { display: block; color: var(--plum); }
.modal-rule:last-child { margin-bottom: 0; }
.modal-actions { display: grid; gap: 9px; }
.memory { margin-bottom: 8px; border: 1px solid #ead4e1; border-radius: 9px; background: #fbf0f2; padding: 12px; color: #5c4661; }
.memory summary { cursor: pointer; color: #56305d; font-weight: 700; }
.memory p { margin: 8px 0 0; white-space: pre-line; }
.memory.locked { color: #6d5a71; }
.noscript { margin: 10px 30px; color: #ffebce; }

@media (max-width: 960px) {
  .shell { width: calc(100% - 42px); }
  .game-layout { grid-template-columns: minmax(0, 1.45fr) minmax(295px, 1fr); gap: 13px; }
  .scene { min-height: 510px; }
  .dialogue { padding: 25px 20px 19px; }
  .character { right: 4%; width: min(57%, 340px); }
}
@media (max-width: 680px) {
  .shell { width: calc(100% - 28px); }
  .header-content { min-height: 58px; gap: 6px; }
  .header-content nav { gap: 2px; }
  .brand { gap: 6px; font-size: 13px; }
  .brand-mark { width: 30px; height: 30px; border-radius: 8px; }
  .brand-mark img { width: 23px; height: 23px; }
  .nav-button { padding: 5px 6px; font-size: 11px; min-height: 34px; }
  .journal-button span { font-size: 10px; margin-left: 2px; }
  .intro { padding-block: 21px 17px; }
  .eyebrow { font-size: 11px; }
  h1 { font-size: clamp(36px, 10vw, 49px); }
  .subtitle { margin-top: 8px; font-size: 13px; }
  .game-layout { display: block; }
  .scene { min-height: 0; height: clamp(215px, 64vw, 360px); border-radius: 15px; margin-bottom: 11px; }
  .scene-status { inset: 10px 10px auto; }
  .scene-caption { bottom: 8px; left: 11px; font-size: 10px; }
  .shop-status, .windows { padding: 4px 8px; min-height: 27px; font-size: 10px; }
  .character { right: 9%; bottom: 10%; width: min(47%, 206px); }
  .cake-moment { right: 11%; bottom: 8%; width: 35%; min-width: 100px; }
  .dialogue { border-radius: 15px; padding: 17px 16px 16px; }
  .story { padding-block: 13px 12px; }
  .story h2 { margin-bottom: 13px; }
  .line { font-size: 14px; min-height: 0; }
  .choice-hint { display: none !important; }
  .game-footer { margin-top: 5px; padding-bottom: 11px; font-size: 11px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

</style>

  "third-invite": {

      "她慢慢坐下，脚尖在地板上碰了两下。\n「原来从这儿看，能看见门外的灯。」\n她把白碟递给你，手指还扣着碟边。",

    lights: 1,
  },
  "third-door": {
    ...response(2, "lin-welcome",
      "她把纸包折到一半，停了下来。\n「那先等等。我还没给自己留过蓝莓。」\n她坐到门边，把柜台上的白碟递过来。",
      "接过白碟", "berry"),
    lights: 1,
  },
  berry: {
    chapter: 2, speaker: "旁白", portrait: "cake", lights: 1,
    line: "白碟里只剩一颗。林小包把方蛋糕朝你推了推，特意把最靠近你的一角空了出来。",
    actions: continueTo("替林小包放上蓝莓", "berry-placed"),
  },
  "berry-placed": {
    chapter: 2, speaker: "林小包", portrait: "cake", berry: true, lights: 1,
    line: "蓝莓落在蛋糕上，轻轻闪了一下。\n「这颗是我的。」她说完才抬头看你。",
    actions: continueTo("陪她坐到打烊", "goodnight"),
  },
  goodnight: {
    chapter: 2, speaker: "林小包", portrait: "lin-blush", lights: 0,
    line: "最后一扇窗合上了。门牌暗下去，柜台的小灯还亮着。\n「你明晚还来吗？」",
    actions: [
      { label: "明晚，我是专程来见你的。", next: ({ choices }) => {
        const moments = Number(choices.first === "sit")
          + Number(choices.second === "share")
          + Number(choices.third === "invite");
        return moments >= 2 ? "ending-reunion" : "slow-reply";
      } },
      { label: "明晚还给我留把椅子吗？", next: "ending-seat" },

    ],
  },
  "slow-reply": {
    ...response(2, "lin-blush",
      "她捏着纸托想了一会儿，才轻声说：「那你先多来坐几次。我们慢慢认识。」",
      "和她道晚安", "ending-seat"),
    lights: 0,
  },

for (const [id, ending] of Object.entries(endings)) {
  scenes[`ending-${id}`] = {
    ...ending,
    chapter: 2, speaker: "旁白", ending: id, lights: 0,
    actions: continueTo("重走这三夜", "arrive"),
  };
}

const choiceValues = { first: ["sit", "wrap"], second: ["share", "wait"], third: ["invite", "door"] };

function restore(value) {
  const state = value && typeof value === "object" ? value : {};
  const node = typeof state.node === "string" && Object.hasOwn(scenes, state.node) ? state.node : "arrive";
  const choices = Object.fromEntries(Object.entries(choiceValues)
    .filter(([key, values]) => values.includes(state.choices?.[key]))
    .map(([key]) => [key, state.choices[key]]));
  const unlocked = Array.isArray(state.unlocked)
    ? [...new Set(state.unlocked.filter((id) => typeof id === "string" && Object.hasOwn(endings, id)))]
    : [];
  return { node, choices, unlocked };
}

function sceneFor(state) {
  const scene = scenes[state.node];
  return { ...scene, line: typeof scene.line === "function" ? scene.line(state) : scene.line };
}

function restart(state) {
  return { node: "arrive", choices: {}, unlocked: state.unlocked };
}

function choose(state, index) {
  const action = scenes[state.node].actions[index];
  if (!action) return state;
  if (action.next === "arrive") return restart(state);
  const node = typeof action.next === "function" ? action.next(state) : action.next;
  const choices = action.choice ? { ...state.choices, [action.choice[0]]: action.choice[1] } : state.choices;
  const ending = scenes[node].ending;
  const unlocked = ending && !state.unlocked.includes(ending)
    ? [...state.unlocked, ending] : state.unlocked;
  return { node, choices, unlocked };
}

const STORAGE_KEY = "half-pixel-cake-shop:story:v1";
const get = (id) => document.getElementById(id);
const story = get("story");
const actions = get("actions");
const modal = get("modal");
const modalTitle = get("modal-title");
const modalBody = get("modal-body");
const character = get("character");
const windows = get("windows");
const windowNames = ["两扇窗都熄了", "一扇窗亮着", "两扇窗亮着"];
let storage = true;
let state = readProgress();

function readProgress() {
  let saved = null;
  try {
    saved = localStorage.getItem(STORAGE_KEY);
  } catch {
    storage = false;
  }
  try {
    return restore(JSON.parse(saved));
  } catch {
    return restore(null);
  }
}

function saveProgress() {
  if (storage) {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    } catch {
      storage = false;
    }
  }
  if (!storage) get("save-status").textContent = "进度仅保留到本页关闭";
}

function node(tag, className, label) {
  const element = document.createElement(tag);
  if (className) element.className = className;
  if (label) element.textContent = label;
  return element;
}

function actionButton(label, onClick, index = null) {
  const button = node("button", index === null ? "action primary" : "action");
  button.type = "button";
  if (index !== null) {
    const number = node("span", "choice-index", String(index + 1));
    number.setAttribute("aria-hidden", "true");
    button.append(number);
  }
  const arrow = node("span", "arrow", "→");
  arrow.setAttribute("aria-hidden", "true");
  button.append(node("span", "", label), arrow);
  button.addEventListener("click", onClick);
  return button;
}

function advance(index) {
  const next = choose(state, index);
  if (next === state) return;
  state = next;
  saveProgress();
  render(true);
}

function render(focusStory = false) {
  const scene = sceneFor(state);
  const chapter = chapters[scene.chapter];
  const isEnding = Boolean(scene.ending);
  const lights = scene.lights ?? 2;
  const showCake = scene.portrait === "cake";
  const hasChoices = scene.actions.length > 1;

  get("chapter-label").textContent = isEnding ? "结局已收录" : chapter.label;
  get("chapter-title").textContent = isEnding ? scene.title : chapter.title;
  get("speaker-name").textContent = scene.speaker;
  get("speaker").dataset.character = String(scene.speaker === "林小包");
  get("line").textContent = scene.line;
  [...get("chapter-track").children].forEach((step, index) => {
    step.classList.toggle("current", index === scene.chapter);
    step.classList.toggle("visited", index < scene.chapter);
    if (index === scene.chapter) step.setAttribute("aria-current", "step");
    else step.removeAttribute("aria-current");
  });

  get("scene").dataset.lights = lights;
  get("shop-state").textContent = isEnding ? "已打烊" : lights ? "夜间营业" : "柜台灯还亮着";
  windows.setAttribute("aria-label", windowNames[lights]);
  [...windows.children].forEach((item, index) => item.classList.toggle("lit", index < lights));
  get("cake-moment").hidden = !showCake;
  get("cake-berry").classList.toggle("placed", Boolean(scene.berry));
  character.hidden = showCake;
  if (!showCake && character.dataset.portrait !== scene.portrait) {
    character.src = portraitImages[scene.portrait];
    character.dataset.portrait = scene.portrait;
  }

  actions.replaceChildren(...scene.actions.map((action, index) =>
    actionButton(action.label, () => advance(index), hasChoices ? index : null)
  ));
  get("choice-hint").hidden = !hasChoices;
  get("journal-count").textContent = `${state.unlocked.length} / ${Object.keys(endings).length}`;
  get("restart").hidden = state.node === "arrive";
  if (focusStory) {
    story.tabIndex = -1;
    story.focus({ preventScroll: true });
  }
}

function openModal(title, ...contents) {
  modalTitle.textContent = title;
  modalBody.replaceChildren(...contents);
  modal.showModal();
}

get("about").addEventListener("click", () => {
  const rules = [
    ["门借一盏灯", "两扇窗里只要还有一扇亮着，店门就留在原处。最后一扇合上，柜台灯会亮到客人走出去。"],
    ["坐过就留一颗莓", "林小包为每位坐过的客人留一颗蓝莓。同一晚回来，也还是原来那颗。"],
    ["蛋糕可以带走", "林小包会用牛皮纸包好客人没吃完的蛋糕，再送到门口。"],
  ];
  openModal("店里的规矩", ...rules.map(([heading, detail]) => {
    const paragraph = node("p", "modal-rule");
    paragraph.append(node("strong", "", heading), detail);
    return paragraph;
  }));
});

get("journal").addEventListener("click", () => {
  const entries = Object.entries(endings).map(([id, ending], index) => {
    if (!state.unlocked.includes(id)) return node("p", "memory locked", `结局 ${index + 1} · 待解锁`);
    const entry = node("details", "memory");
    entry.append(node("summary", "", ending.title), node("p", "", ending.line));
    return entry;
  });
  openModal("回忆簿", ...entries);
});

get("restart").addEventListener("click", () => {
  const buttons = node("div", "modal-actions");
  buttons.append(actionButton("回到第一夜", () => {
    state = restart(state);
    saveProgress();
    modal.close();
    render(true);
  }));
  openModal("重走这三夜", node("p", "", "回到第一夜。已收录的结局还会留在回忆簿里。"), buttons);
});

document.addEventListener("keydown", (event) => {
  if (modal.open || event.repeat || event.altKey || event.ctrlKey || event.metaKey) return;
  const count = actions.children.length;
  const index = Number(event.key) - 1;
  if (count > 1 && /^[1-3]$/.test(event.key) && index < count) {
    event.preventDefault();
    advance(index);
  }
});

saveProgress();
render();

})();
</script>
